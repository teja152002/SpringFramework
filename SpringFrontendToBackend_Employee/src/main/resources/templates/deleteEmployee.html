<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .delete-container {
            width: 450px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 10px #cccccc;
        }

        .details {
            text-align: left;
            margin: 25px 0;
            line-height: 1.8;
        }

        .warning {
            color: #dc3545;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .cancel-btn {
            background-color: #555555;
        }
    </style>
</head>

<body>

<div class="delete-container">

    <h2>Delete Employee</h2>

    <p class="warning">
        Are you sure you want to delete this employee?
    </p>

    <div class="details">

        <p>
            <strong>ID:</strong>
            <span th:text="${employee.empId}"></span>
        </p>

        <p>
            <strong>Name:</strong>
            <span th:text="${employee.empName}"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${employee.empEmail}"></span>
        </p>

        <p>
            <strong>Designation:</strong>
            <span th:text="${employee.empDesignation}"></span>
        </p>

    </div>

    <form th:action="@{/delete/{id}
          (id=${employee.empId})}"
          method="post"
          style="display: inline;">

        <button type="submit"
                class="btn delete-btn">
            Confirm Delete
        </button>

    </form>

    <a th:href="@{/display}"
       class="btn cancel-btn">
        Cancel
    </a>

</div>

</body>
</html>
