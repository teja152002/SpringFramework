<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 30px;
        }

        h2 {
            text-align: center;
            color: #333333;
        }

        .top-actions {
            width: 90%;
            margin: 20px auto;
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px #cccccc;
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #0078d7;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            margin: 2px;
            border-radius: 4px;
        }

        .home-btn {
            background-color: #555555;
        }

        .add-btn {
            background-color: #198754;
        }

        .update-btn {
            background-color: #f0ad4e;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .empty-message {
            color: #777777;
            text-align: center;
        }
    </style>
</head>

<body>

<h2>Employee List</h2>

<div class="top-actions">

    <a th:href="@{/}" class="btn home-btn">
        Home
    </a>

    <a th:href="@{/add}" class="btn add-btn">
        Add Employee
    </a>

</div>

<table>

    <thead>
        <tr>
            <th>Employee ID</th>
            <th>Employee Name</th>
            <th>Email</th>
            <th>Designation</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="5" class="empty-message">
                No employees found.
            </td>
        </tr>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.empId}"></td>

            <td th:text="${employee.empName}"></td>

            <td th:text="${employee.empEmail}"></td>

            <td th:text="${employee.empDesignation}"></td>

            <td>
                <a th:href="@{/update/{id}(id=${employee.empId})}"
                   class="btn update-btn">
                    Update
                </a>

                <a th:href="@{/delete/{id}(id=${employee.empId})}"
                   class="btn delete-btn">
                    Delete
                </a>
            </td>

        </tr>

    </tbody>

</table>

</body>
</html>
