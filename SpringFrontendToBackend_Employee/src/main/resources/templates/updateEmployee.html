<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .form-container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #eeeeee;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #f0ad4e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Update Employee</h2>

    <form th:action="@{/updateSave}"
          th:object="${employee}"
          method="post">

        <label for="empId">Employee ID:</label>
        <input id="empId"
               type="number"
               th:field="*{empId}"
               readonly>

        <label for="empName">Name:</label>
        <input id="empName"
               type="text"
               th:field="*{empName}"
               required>

        <label for="empEmail">Email:</label>
        <input id="empEmail"
               type="email"
               th:field="*{empEmail}"
               required>

        <label for="empDesignation">
            Designation:
        </label>
        <input id="empDesignation"
               type="text"
               th:field="*{empDesignation}"
               required>

        <button type="submit">
            Update Employee
        </button>

    </form>

    <a th:href="@{/display}" class="back-link">
        Back to Employee List
    </a>

</div>

</body>
</html>
